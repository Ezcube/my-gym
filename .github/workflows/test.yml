name: Tests

on:
  pull_request:
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'android-sync/**'
      - 'mcp/**'
      - 'test/**'
      - 'web/**'
      - 'ops/**'
      - 'docs/PRODUCTION.md'
      - '.env.example'
      - 'docker-compose.yml'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'android-sync/**'
      - 'mcp/**'
      - 'test/**'
      - 'web/**'
      - 'ops/**'
      - 'docs/PRODUCTION.md'
      - '.env.example'
      - 'docker-compose.yml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check deployment contracts
        run: node --disable-warning=ExperimentalWarning --test test/release-contracts.test.mjs
      - name: Check backup script syntax
        run: sh -n ops/backup-data.sh ops/restore-data.sh

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm test
        working-directory: api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      - run: node scripts/check-source-strings.mjs --strict
        working-directory: frontend
      - run: npm run test:fatigue-probe
        working-directory: frontend

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'platform-tools'
      - name: Test and assemble companion APK
        working-directory: android-sync
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
            > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload companion debug APK
        uses: actions/upload-artifact@v7
        with:
          name: my-gym-health-sync-debug-${{ github.sha }}
          path: |
            android-sync/app/build/outputs/apk/debug/app-debug.apk
            android-sync/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp
      - run: npm run check:node-loadable
        working-directory: mcp
